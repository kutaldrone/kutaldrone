backend:
  name: git-gateway
  branch: main
publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # PROJECTS
  - name: "projects"
    label: "Projeler"
    label_singular:  "Proje"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Kategori", name: "category", widget: "select", options: ["Denetim", "Etkinlikler", "Emlak", "Çevre", "Haritalama"]}
      - {label: "Görsel", name: "image", widget: "image"}
      - {label: "Açıklama", name: "description", widget: "text"}
      - {label: "Yayın Tarihi", name: "date", widget: "datetime"}

  # TESTIMONIALS
  - name: "testimonials"
    label: "Referanslar"
    label_singular: "Referans"
    folder: "content/testimonials"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "İsim", name: "name", widget: "string"}
      - {label: "Rol", name: "role", widget: "string"}
      - {label: "Yorum", name: "quote", widget: "text"}
      - {label: "Profil Fotoğrafı", name: "image", widget: "image"}

  # MEDIA GALLERY
  - name: "gallery"
    label: "Galeri"
    label_singular: "Görsel"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Görsel/Video", name: "media", widget: "image"}
      - {label: "Tür", name: "type", widget: "select", options: ["Fotoğraf", "Video"]}
      - {label: "Kategori", name: "category", widget: "select", options: ["Hero", "Projeler", "Ekip", "Ekipman", "Diğer"]}
      - {label: "Alt Text (SEO)", name: "alt", widget: "string"}
      - {label: "Yüklenme Tarihi", name: "date", widget: "datetime"}

  # SETTINGS
  - name: "settings"
    label: "Site Ayarları"
    files:
      # GENERAL
      - label: "Genel Ayarlar"
        name: "general"
        file: "content/settings/general.json"
        fields:
          - {label: "Site Başlığı", name: "siteTitle", widget: "string"}
          - {label: "Site Açıklaması", name: "siteDescription", widget: "text"}
          - {label: "Logo", name: "logo", widget: "image"}
          - {label: "Telefon", name: "phone", widget: "string"}
          - {label: "E-posta", name: "email", widget: "string", required: false}
          - {label: "Adres", name: "address", widget: "text"}
      
      # HERO
      - label: "Hero Section"
        name: "hero"
        file: "content/settings/hero.json"
        fields:
          - {label: "Ana Başlık (Satır 1)", name: "titleLine1", widget: "string"}
          - {label: "Ana Başlık (Satır 2)", name: "titleLine2", widget: "string"}
          - {label: "Arka Plan Görseli", name: "backgroundImage", widget: "image"}
          - {label: "Buton 1 Metni", name: "button1Text", widget: "string"}
          - {label: "Buton 2 Metni", name: "button2Text", widget: "string"}
          - label: "Özellik Rozetleri"
            name: "badges"
            widget: "list"
            fields:
              - {label: "Metin", name: "text", widget: "string"}
              - {label: "İkon", name: "icon", widget: "string"}
      
      # TEAM
      - label: "Ekip"
        name: "team"
        file: "content/settings/team.json"
        fields:
          - label: "Ekip Üyeleri"
            name: "members"
            widget: "list"
            fields:
              - {label: "İsim", name: "name", widget: "string"}
              - {label: "Rol", name: "role", widget: "string"}
              - {label: "Fotoğraf", name: "photo", widget: "image"}
              - {label: "Bio", name: "bio", widget: "text"}

  # RECENT FLIGHTS (Son Uçuşlar)
  - name: "recentFlights"
    label: "Son Uçuşlar"
    label_singular: "Uçuş"
    folder: "content/recent-flights"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Kategori", name: "category", widget: "select", options: ["Denetim", "Etkinlik", "Sinematografi", "Haritalama", "Çevre", "Emlak"]}
      - {label: "Görsel", name: "image", widget: "image"}
      - {label: "Açıklama", name: "description", widget: "text"}
      - {label: "Tarih", name: "date", widget: "datetime"}
      - {label: "Sıralama", name: "order", widget: "number", default: 0, value_type: "int"}

  # SERVICES (Hizmetler)
  - name: "services"
    label: "Hava Hizmetleri"
    label_singular: "Hizmet"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Açıklama", name: "description", widget: "text"}
      - {label: "Görsel", name: "image", widget: "image"}
      - {label: "Sıralama", name: "order", widget: "number", default: 0, value_type: "int"}
      - {label: "Aktif", name: "active", widget: "boolean", default: true}

  # PRICING (Fiyatlandırma)
  - name: "pricing"
    label: "Fiyatlandırma"
    label_singular: "Paket"
    folder: "content/pricing"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Paket Adı", name: "name", widget: "string"}
      - {label: "Fiyat", name: "price", widget: "string", hint: "Örn: ₺2,500"}
      - {label: "Fiyat Açıklaması", name: "priceDescription", widget: "string", hint: "Örn: /proje"}
      - {label: "Öne Çıkan", name: "highlighted", widget: "boolean", default: false}
      - label: "Özellikler"
        name: "features"
        widget: "list"
        field: {label: "Özellik", name: "Feature", widget: "string"}
      - {label: "Buton Metni", name: "buttonText", widget: "string", default: "Teklif Al"}
      - {label: "Sıralama", name: "order", widget: "number", default: 0, value_type: "int"}
      - {label: "Renk", name: "color", widget: "select", options: ["dark", "lime", "white"], default: "white"}

  # BLOG
  - name: "blog"
    label: "Blog Yazıları"
    label_singular: "Yazı"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Başlık", name: "title", widget: "string"}
      - {label: "Öne Çıkan Görsel", name: "image", widget: "image"}
      - {label: "Özet", name: "excerpt", widget: "text"}
      - {label: "Yayın Tarihi", name: "date", widget: "datetime"}
      - {label: "İçerik", name: "body", widget: "markdown"}
      - {label: "SEO Başlık", name: "seoTitle", widget: "string", required: false}
      - {label: "SEO Açıklama", name: "seoDescription", widget: "text", required: false}

  # LOCATIONS (Hizmet Bölgeleri)
  - name: "locations"
    label: "Hizmet Bölgeleri"
    label_singular: "Bölge"
    folder: "content/locations"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Bölge Adı", name: "title", widget: "string"}
      - {label: "URL Yolu (Slug)", name: "slug", widget: "string", hint: "Örn: tekirdag-drone-cekimi"}
      - {label: "Hero Görseli", name: "image", widget: "image"}
      - {label: "Hero Başlık", name: "heroTitle", widget: "string", default: "Profesyonel Drone Çekimi"}
      - {label: "Alt Başlık", name: "heroSubtitle", widget: "string"}
      - {label: "Giriş Metni", name: "introText", widget: "markdown"}
      - label: "Öne Çıkan Hizmetler"
        name: "highlightedServices"
        widget: "relation"
        collection: "services"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        multiple: true
      - {label: "Harita Embed Kodu", name: "mapEmbed", widget: "text", required: false}
      - {label: "SEO Başlık", name: "seoTitle", widget: "string"}
      - {label: "SEO Açıklama", name: "seoDescription", widget: "text"}

  # FAQ (Sıkça Sorulan Sorular)
  - name: "faq"
    label: "Sıkça Sorulan Sorular"
    label_singular: "Soru"
    folder: "content/faq"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Soru", name: "question", widget: "string"}
      - {label: "Cevap", name: "answer", widget: "text"}
      - {label: "Sıralama", name: "order", widget: "number", default: 0, value_type: "int"}

  # SOCIAL MEDIA & CONTACT (Ayarlar -> Sosyal Medya)
  - name: "social"
    label: "Sosyal Medya & İletişim"
    files:
      - label: "Sosyal Medya Linkleri"
        name: "socialMedia"
        file: "content/settings/social.json"
        fields:
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "YouTube URL", name: "youtube", widget: "string", required: false}
          - {label: "Facebook URL", name: "facebook", widget: "string", required: false}
          - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
          - {label: "WhatsApp Numarası", name: "whatsapp", widget: "string", hint: "905xxxxxxxxx formatında"}
          - {label: "E-posta", name: "email", widget: "string"}
          - {label: "Adres", name: "address", widget: "text"}
